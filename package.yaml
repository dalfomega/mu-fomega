name: mu-fomega
version: 0.1.0.0
license: BSD-3-Clause
author: mu-fomega contributors
maintainer: mu-fomega contributors
copyright: "2026"
tested-with: GHC ==9.14.*

extra-source-files:
  - README.md

description: microFomega implementation experiments

dependencies:
  - base >= 4.18 && < 5
  - bytestring
  - containers
  - attoparsec
  - deepseq
  - flatparse
  - megaparsec
  - mtl
  - prettyprinter
  - text

ghc-options:
  - -Wall

library:
  source-dirs: src
  exposed-modules:
    - MuFomega
    - MuFomega.Pretty
    - MuFomega.Traversal
    - MuFomega.Shift
    - MuFomega.Substitute
    - MuFomega.Church
    - MuFomega.Normalize
    - MuFomega.TypeCheck
    - MuFomega.Parser.Megaparsec
    - MuFomega.Parser.Attoparsec
    - MuFomega.Parser.FlatParse
    - MuFomega.Syntax.Common
    - MuFomega.Syntax.Lazy
    - MuFomega.Syntax.Strict

executables:
  mu-fomega:
    main: Main.hs
    source-dirs: app
    dependencies:
      - mu-fomega

tests:
  mu-fomega-test:
    main: Spec.hs
    source-dirs: test
    other-modules:
      - MuFomega.Gen
      - MuFomega.PrettySpec
      - MuFomega.SyntaxSpec
      - MuFomega.ShiftSpec
      - MuFomega.SubstituteSpec
      - MuFomega.TraversalSpec
      - MuFomega.NormalizeSpec
      - MuFomega.ChurchSpec
      - MuFomega.Syntax.Convert
      - MuFomega.Parser.AttoparsecSpec
      - MuFomega.Parser.FlatParseSpec
      - MuFomega.Parser.MegaparsecSpec
      - MuFomega.Parser.EquivalenceSpec
      - MuFomega.Parser.CommonGrammarSpec
      - MuFomega.TypeCheckSpec
    dependencies:
      - mu-fomega
      - QuickCheck
      - deepseq
      - hspec
      - hspec-megaparsec
      - text

benchmarks:
  parser-bench:
    main: ParserBench.hs
    source-dirs: bench/parser
    dependencies:
      - mu-fomega
      - criterion
      - deepseq
      - text
  normalize-bench:
    main: NormalizeBench.hs
    source-dirs: bench/normalize
    ghc-options:
      - -Wall
      - -rtsopts
    dependencies:
      - mu-fomega
      - criterion
      - deepseq
      - text
